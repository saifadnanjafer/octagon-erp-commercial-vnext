<section class="page" id="pageHome">
  <style>
    /* All selectors scoped to #pageHome so nothing leaks into global/theme CSS. */
    #pageHome { padding-bottom: 40px; }
    #pageHome .home-hero {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-xl);
      padding: 34px 36px;
      margin-bottom: 26px;
      background:
        radial-gradient(1200px 300px at 100% -20%, rgba(56,189,248,0.18), transparent 60%),
        radial-gradient(900px 260px at -10% 120%, rgba(129,140,248,0.16), transparent 60%),
        var(--gradient-card);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-md);
    }
    #pageHome .home-hero-row { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap; }
    #pageHome .home-greeting { font-size: 30px; font-weight: 800; color: var(--text); margin: 0 0 6px; line-height:1.25; }
    #pageHome .home-greeting .home-wave { display:inline-block; }
    #pageHome .home-sub { color: var(--text-muted); font-size: 15px; margin: 0; line-height: 1.6; max-width: 560px; }
    #pageHome .home-clock {
      text-align: center; min-width: 150px;
      background: rgba(255,255,255,0.03); border:1px solid var(--border-glass);
      border-radius: var(--radius-lg); padding: 14px 18px;
    }
    #pageHome .home-clock-time { font-size: 30px; font-weight: 800; color: var(--text); letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    #pageHome .home-clock-date { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }

    #pageHome .home-resume {
      display:flex; align-items:center; gap:14px; flex-wrap:wrap;
      margin-top: 22px; padding: 14px 18px;
      background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.25);
      border-radius: var(--radius-md);
    }
    #pageHome .home-resume-txt { color: var(--text); font-size: 14px; font-weight:600; }
    #pageHome .home-resume-txt span { color: var(--accent-blue); }
    #pageHome .home-resume .home-btn { margin-inline-start:auto; }
    #pageHome .home-btn {
      cursor:pointer; border:none; border-radius: var(--radius-sm);
      padding: 10px 18px; font-size: 14px; font-weight: 700; color: #06121f;
      background: linear-gradient(135deg, var(--accent-blue), var(--primary));
      display:inline-flex; align-items:center; gap:8px; transition: var(--transition);
      box-shadow: 0 6px 16px rgba(56,189,248,0.25);
    }
    #pageHome .home-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    #pageHome .home-btn.ghost { background: rgba(255,255,255,0.05); color: var(--text); box-shadow:none; border:1px solid var(--border-glass); }

    #pageHome .home-section-title { font-size: 15px; font-weight: 800; color: var(--text); margin: 4px 2px 14px; display:flex; align-items:center; gap:9px; }
    #pageHome .home-section-title small { color: var(--text-muted); font-weight:600; font-size:12px; }

    #pageHome .home-stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 16px; margin-bottom: 30px; }
    #pageHome .home-stat {
      background: var(--gradient-card); border:1px solid var(--border-glass);
      border-radius: var(--radius-lg); padding: 18px 20px; display:flex; align-items:center; gap:16px;
      transition: var(--transition);
    }
    #pageHome .home-stat:hover { border-color: rgba(255,255,255,0.14); transform: translateY(-2px); }
    #pageHome .home-stat-ico { width:48px; height:48px; border-radius: 14px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
    #pageHome .home-stat-val { font-size: 24px; font-weight: 800; color: var(--text); line-height:1.1; font-variant-numeric: tabular-nums; }
    #pageHome .home-stat-lbl { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }

    #pageHome .home-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 16px; }
    #pageHome .home-tile {
      cursor:pointer; text-align:start;
      background: var(--gradient-card); border:1px solid var(--border-glass);
      border-radius: var(--radius-lg); padding: 20px; transition: var(--transition);
      display:flex; flex-direction:column; gap:12px; min-height: 118px;
    }
    #pageHome .home-tile:hover { transform: translateY(-3px); border-color: rgba(56,189,248,0.4); box-shadow: 0 10px 24px rgba(0,0,0,0.28); }
    #pageHome .home-tile-ico { width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:23px; }
    #pageHome .home-tile-name { font-size: 15px; font-weight: 700; color: var(--text); }
    #pageHome .home-tile-desc { font-size: 12px; color: var(--text-muted); line-height:1.5; margin-top:-4px; }

    @media (max-width: 640px) {
      #pageHome .home-hero { padding: 24px; }
      #pageHome .home-greeting { font-size: 24px; }
      #pageHome .home-clock { min-width: 120px; }
    }
  </style>
  <div id="homeBody"></div>
</section>
